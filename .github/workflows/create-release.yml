name: Create Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    strategy:
      matrix:
        platform: [x86, x64]
        configuration: [Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.

    - uses: dotnet/nbgv@v0.5
      id: nbgv

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Build with MSBuild
      run: |
        msbuild jN.vcxproj -m -p:Configuration=${{ matrix.configuration }} -p:Platform=${{ matrix.platform }} -p:VersionMajor=${{ steps.nbgv.outputs.VersionMajor }} -p:VersionMinor=${{ steps.nbgv.outputs.VersionMinor }} -p:BuildNumber=${{ steps.nbgv.outputs.BuildNumber }} -p:VersionRevision=${{ steps.nbgv.outputs.VersionRevision }}

    - name: Create zip file
      run: |
        if ("${{ matrix.platform }}" -eq "x64") {
          Copy-Item ${{ matrix.platform }}/${{ matrix.configuration }}/*.dll ./deploy/
        } else {
          Copy-Item ${{ matrix.configuration }}/*.dll ./deploy/
        }

        cd ./deploy
        7z a ../jN_${{ steps.nbgv.outputs.SemVer2 }}_${{ matrix.platform }}.zip *

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Build ${{ matrix.platform }} artifacts
        path: |
          jN_*.zip
          ${{ matrix.configuration }}/*.dll
          ${{ matrix.configuration }}/*.pdb
          ${{ matrix.platform }}/${{ matrix.configuration }}/*.dll
          ${{ matrix.platform }}/${{ matrix.configuration }}/*.pdb
        retention-days: 3

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the tag and create the release
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # avoid shallow clone so nbgv can do its work.

      - uses: dotnet/nbgv@v0.5
        id: nbgv

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: Build * artifacts
          merge-multiple: true

      - name: Create tag
        run: |
          git tag ${{ steps.nbgv.outputs.SemVer2 }}
          git push origin ${{ steps.nbgv.outputs.SemVer2 }}

      - name: Create draft release with assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.nbgv.outputs.SemVer2 }}
          name: ${{ steps.nbgv.outputs.SemVer2 }}
          draft: true
          prerelease: false
          files: |
            jN_${{ steps.nbgv.outputs.SemVer2 }}_x64.zip
            jN_${{ steps.nbgv.outputs.SemVer2 }}_x86.zip
