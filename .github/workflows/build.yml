name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # windows-2022 ships the v143 toolset used by jN.vcxproj.
    # windows-latest (Server 2025 / VS 2026) would need -p:PlatformToolset=v145.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x86, x64]
        configuration: [Debug, Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.

    - uses: dotnet/nbgv@v0.5
      id: nbgv

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Build with MSBuild
      run: |
        msbuild jN.vcxproj -m -p:Configuration=${{ matrix.configuration }} -p:Platform=${{ matrix.platform }} -p:VersionMajor=${{ steps.nbgv.outputs.VersionMajor }} -p:VersionMinor=${{ steps.nbgv.outputs.VersionMinor }} -p:BuildNumber=${{ steps.nbgv.outputs.BuildNumber }} -p:VersionRevision=${{ steps.nbgv.outputs.VersionRevision }}

    - name: Create zip file
      run: |
        if ("${{ matrix.platform }}" -eq "x64") {
          Copy-Item ${{ matrix.platform }}/${{ matrix.configuration }}/*.dll ./deploy/
        } else {
          Copy-Item ${{ matrix.configuration }}/*.dll ./deploy/
        }

        cd ./deploy
        7z a ../jN_${{ steps.nbgv.outputs.SemVer2 }}_${{ matrix.platform }}.zip *

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Build artifacts ${{ matrix.platform }} ${{ matrix.configuration }}
        path: |
          jN_*.zip
          ${{ matrix.configuration }}/*.dll
          ${{ matrix.configuration }}/*.pdb
          ${{ matrix.platform }}/${{ matrix.configuration }}/*.dll
          ${{ matrix.platform }}/${{ matrix.configuration }}/*.pdb
        retention-days: 3
